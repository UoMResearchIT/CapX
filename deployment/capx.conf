# This is to go in the sites-available directory and then symlinked to the sites-enabled replacing the default site
server {
  listen              443 ssl;
  listen              [::]:443 ssl;
  ssl_certificate     /etc/ssl/certs/balex.itservices.manchester.ac.uk.crt;
  ssl_certificate_key /etc/ssl/private/balex.itservices.manchester.ac.uk.key;
  ssl_protocols       TLSv1.2;
  ssl_prefer_server_ciphers on;
  ssl_dhparam         /etc/ssl/certs/dhparam.pem;
  ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
  ssl_ecdh_curve      secp384r1; # Requires nginx >= 1.1.0
  ssl_session_timeout 10m;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_tickets off; # Requires nginx >= 1.5.9
  resolver            8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout    5s;
  add_header          X-Frame-Options SAMEORIGIN;
  add_header          X-Content-Type-Options nosniff;
  add_header          X-XSS-Protection "1; mode=block";
  add_header          Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
  server_name         balex.itservices.manchester.ac.uk;
  location            / {
	proxy_pass         http://localhost:5000;
	proxy_http_version 1.1;
	proxy_set_header   Upgrade $http_upgrade;
	proxy_set_header   Connection $connection_upgrade;
	proxy_set_header   Host $host;
	proxy_cache_bypass $http_upgrade;
	proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header   X-Forwarded-Proto $scheme;
  }
  location            /api/ {
	proxy_pass         http://localhost:6000/;
	proxy_http_version 1.1;
	proxy_set_header   Upgrade $http_upgrade;
	proxy_set_header   Connection $connection_upgrade;
	proxy_set_header   Host $host;
	proxy_cache_bypass $http_upgrade;
	proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

server {
  listen      80;
  listen      [::]:80;
  server_name balex.itservices.manchester.ac.uk;
  return      302 https://$server_name$request_uri;
}

