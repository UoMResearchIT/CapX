version: 2
registries:
  my-nuget-feed:
    type: nuget-feed
    url: https://nuget.pkg.github.com/UoMResearchIT/index.json
    username: ${{secrets.ACTIONS_NUGET_USER}}
    password: ${{secrets.ACTIONS_REPO_TOKEN}}

updates:
  - package-ecosystem: "nuget"
    directory: "/PPMTool/"  # Adjust if your .csproj is in a subfolder
    schedule:
      interval: "weekly"
    registries: "*"
