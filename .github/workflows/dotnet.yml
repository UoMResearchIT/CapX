# This workflow will check formatting and build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: C# .NET

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  format_check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PPMTool

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ORG_GITHUB_APP_ID }}
          private-key: ${{ secrets.ORG_GITHUB_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          submodules: 'true'
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Format
        run: dotnet format PPMTool.sln \
          --exclude ../Blazor-ApexCharts/src/Blazor-ApexCharts.csproj \
          --verify-no-changes \
          --no-restore \
          --verbosity detailed

  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PPMTool

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ORG_GITHUB_APP_ID }}
          private-key: ${{ secrets.ORG_GITHUB_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          submodules: 'true'
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore --verbosity detailed

      - name: Build
        run: dotnet build --no-restore -c Release