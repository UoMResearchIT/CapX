# This workflow will check formatting and build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: C# .NET

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  format_check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PPMTool
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
        token: ${{ secrets.ACTIONS_REPO_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Format
      run: dotnet format PPMTool.sln --exclude ../Blazor-ApexCharts/src/Blazor-ApexCharts.csproj --verify-no-changes --no-restore --verbosity detailed
      
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PPMTool
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
        token: ${{ secrets.ACTIONS_REPO_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore --verbosity detailed
    - name: Build
      run: dotnet build --no-restore -c Release