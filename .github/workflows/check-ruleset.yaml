name: Check Repository Ruleset

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read
jobs:
  check:
    if: github.repository_owner == 'UoMResearchIT'
    name: Check Ruleset
    uses: UoMResearchIT/actions/.github/workflows/check-ruleset.yaml@8839be4e18a5a880aa052da40d9730445bb42e99 # temporary feature branch that allows "ignore" argument
    with:
      bot-id: ${{ vars.ORG_ACTIONS_BOT_APP_ID }}
      ignore: '["require_code_owner_review"]'
    secrets:
      bot-key: ${{ secrets.ORG_ACTIONS_BOT_PRIVATE_KEY }}
