name: Docker Images Build and Health Check

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      BUILD_CONFIGURATION: Local
      API_KEY_SECRET: super-secret-key-that-is-32-chars-min
      CONNECTION_STRING: Data Source=state/PPMTool.db;Cache=Shared;Mode=ReadWriteCreate;
      LEAVEBOOKINGS_CONNECTION_STRING: Data Source=state/LeaveBookings.db;Cache=Shared;Mode=ReadWriteCreate;
      CAPX_HTTP_PORT: 3000
      CAPX_API_PORT: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start containers and wait for health checks
        run: docker compose up --wait --wait-timeout 60

      - name: Test homepage responds
        run: |
          curl --fail --silent --show-error -L http://localhost:3000 | grep -q '<!DOCTYPE html>'
          echo "Homepage test passed"

      - name: Test API responds
        run: |
          curl --fail --silent --show-error http://localhost:8080/swagger/index.html | grep -q 'swagger'
          echo "API test passed"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down containers
        if: always()
        run: docker compose down

