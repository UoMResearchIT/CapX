name: Docker Images Build and Health Check

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      BUILD_CONFIGURATION: Local
      API_KEY_SECRET: super-secret-key-that-is-32-chars-min
      CONNECTION_STRING: Data Source=/app/state/PPMTool.db;Cache=Shared;Mode=ReadWriteCreate;
      LEAVEBOOKINGS_CONNECTION_STRING: Data Source=/app/state/LeaveBookings.db;Cache=Shared;Mode=ReadWriteCreate;
      CAPX_HTTP_PORT: 3000
      CAPX_STATE_DIR: ./capx-state
      SEED_DUMMY_DATA: "TRUE"
      SUPERUSER_NAME: "Captain Marvel"
      SUPERUSER_USERNAME: c123456m
      SUPERUSER_EMAIL: captain.marvel@manchester.ac.uk
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create state directory for bind mount
        run: mkdir -p capx-state

      - name: Build Docker images
        run: docker compose build

      - name: Start container and wait for health checks
        run: docker compose up --wait --wait-timeout 120

      - name: Test homepage responds
        run: |
          curl --fail --silent --show-error -L http://localhost:${CAPX_HTTP_PORT} | grep -q '<!DOCTYPE html>'
          echo "Homepage test passed"

      - name: Test API responds
        run: |
          curl --fail --silent --show-error http://localhost:${CAPX_HTTP_PORT}/swagger/index.html | grep -q 'swagger'
          echo "API test passed"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore PPMTool/PPMTool.sln

      - name: Install Playwright
        run: |
          dotnet build PPMTool.Tests/PPMTool.Tests.csproj -c Release
          pwsh PPMTool.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Run Tests
        env:
          TEST_BASE_URL: http://localhost:${{ env.CAPX_HTTP_PORT }}
          ConnectionStrings__PPMToolContextConnection: Data Source=${{ github.workspace }}/capx-state/PPMTool.db;Cache=Shared;Mode=ReadWriteCreate;
          DbProvider: sqlite
        run: |
          dotnet test PPMTool.Tests/PPMTool.Tests.csproj -c Release --verbosity normal --logger "console;verbosity=detailed" --no-build

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down containers
        if: always()
        run: docker compose down

