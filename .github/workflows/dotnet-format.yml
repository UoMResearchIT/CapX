# This workflow will check formatting and build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: C# .NET

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  format_check:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PPMTool
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.ACTIONS_REPO_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Format
      run: dotnet format PPMTool.sln --exclude ../Blazor-ApexCharts/src/Blazor-ApexCharts.csproj --verify-no-changes --no-restore --verbosity diagnostic
      
  build:
  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PPMTool
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.ACTIONS_REPO_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Ensure GitHub NuGet Source
      run: |
        dotnet nuget update source UoMResearchITGitHub \
        -u ${{ secrets.ACTIONS_NUGET_USER }} \
        -p ${{ secrets.ACTIONS_REPO_TOKEN }} \
        --store-password-in-clear-text
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore