services:
  blazor-server:
    image: capx:latest  # Use a named image
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    ports:
      - ${CAPX_HTTP_PORT}:${CAPX_HTTP_PORT}
    
    volumes:
      - db_data:/app/state
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://0.0.0.0:${CAPX_HTTP_PORT}
      - API_KEY_SECRET=${API_KEY_SECRET}
    
    command: ["dotnet", "PPMTool.dll"]
  
  api:
    depends_on:
      - blazor-server
    image: capx:latest  # Reuse the same image
    container_name: capx-api
    ports:
      - ${CAPX_API_PORT}:${CAPX_API_PORT}
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://0.0.0.0:${CAPX_API_PORT}
      - API_KEY_SECRET=${API_KEY_SECRET}
    
    command: ["dotnet", "PPMTool.API.dll"]

volumes:
  db_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN