services:
  capx:
    build:
      context: .
      target: final
      args:
        BUILD_CONFIG: ${BUILD_CONFIGURATION:?}
    volumes:
      - state:/app/state
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:?}
      - API_KEY_SECRET=${API_KEY_SECRET:?}
      - CONNECTION_STRING=${CONNECTION_STRING:?}
      - LEAVEBOOKINGS_CONNECTION_STRING=${LEAVEBOOKINGS_CONNECTION_STRING:?}
      - SEED_DUMMY_DATA=${SEED_DUMMY_DATA:-FALSE}
      - SUPERUSER_NAME=${SUPERUSER_NAME:?}
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:?}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:?}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_SMTP_SERVER=${MAIL_SMTP_SERVER:-}
      - CAS_PROTOCOL=${CAS_PROTOCOL:-}
      - CAS_BASE_URL=${CAS_BASE_URL:-}
      - AUTH_HOST_URL=${AUTH_HOST_URL:-}
    ports:
      - ${CAPX_HTTP_PORT:?}:8080
    command: ["dotnet", "PPMTool.dll"]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/ &&
           curl -f http://localhost:8080/swagger.index.html"
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  state: