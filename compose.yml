services:
  capx:
    build:
      context: .
      target: final
      secrets:
        - github_token
    volumes:
      - state:/app/state
    environment:    
      - GITHUB_TOKEN=${GITHUB_TOKEN:?}
      - API_KEY_SECRET=${API_KEY_SECRET:?}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - ${CAPX_HTTP_PORT:-3000}:8080
    command: ["dotnet", "PPMTool.dll"]

  api:
    depends_on:
      - capx
    build:
      context: .
      target: final
      secrets:
        - github_token
    volumes:
      - state:/app/state
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - DB_CONNECTION_STRING="Data Source=PPMTool.db;Cache=Shared;Mode=ReadWriteCreate;"
    ports:
      - ${CAPX_API_PORT:-8080}:8080
    command: ["dotnet", "PPMTool.API.dll"]

volumes:
  state:

secrets:
  github_token:
    environment: GITHUB_TOKEN
