services:
  capx:
    env_file: .env
    container_name: capx-frontend
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    ports:
      - ${CAPX_HTTP_PORT}:${CAPX_HTTP_PORT}
    
    volumes:
      - db_data:/app/state
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:${CAPX_HTTP_PORT}

volumes:
  db_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
