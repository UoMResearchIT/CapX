services:
  capx:
    image: capx:latest
    container_name: capx-blazor-server
    build:
      context: .
      target: final
      dockerfile: Dockerfile
      secrets:
        - github_token
    volumes:
      - state:/app/state
    env_file: .env
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - API_KEY_SECRET=${API_KEY_SECRET:-super-secret-key-that-is-32-chars-min}
      - CAPX_HTTP_PORT=${CAPX_HTTP_PORT:-3000}
      - ASPNETCORE_URLS=http://0.0.0.0:${CAPX_HTTP_PORT:-3000}    
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - ${CAPX_HTTP_PORT}:${CAPX_HTTP_PORT}
    command: ["dotnet", "PPMTool.dll"]

  api:
    depends_on:
      - capx
    image: capx:latest
    container_name: capx-api
    volumes:
      - state:/app/state
    env_file: .env
    environment:
      - CAPX_API_PORT=${CAPX_API_PORT:-8080}
      - ASPNETCORE_URLS=http://0.0.0.0:${CAPX_API_PORT:-8080}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - USE_DOCKER_CONNECTION_STRING=${USE_DOCKER_CONNECTION_STRING:-true}
    ports:
      - ${CAPX_API_PORT}:${CAPX_API_PORT}
    command: ["dotnet", "PPMTool.API.dll"]

volumes:
  state:

secrets:
  github_token:
    environment: GITHUB_TOKEN
