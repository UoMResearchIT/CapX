services:
  capx:
    build:
      context: .
      target: final
      secrets:
        - github_token
    volumes:
      - state:/app/state
    environment:    
      - GITHUB_TOKEN=${GITHUB_TOKEN:?}
      - API_KEY_SECRET=${API_KEY_SECRET:?}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - ${CAPX_HTTP_PORT:-3000}:8080
    command: ["dotnet", "PPMTool.dll"]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      start_period: 1s
      retries: 5

  api:
    depends_on:
      - capx
    build:
      context: .
      target: final
      secrets:
        - github_token
    volumes:
      - state:/app/state
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - DB_CONNECTION_STRING="Data Source=PPMTool.db;Cache=Shared;Mode=ReadWriteCreate;"
    ports:
      - ${CAPX_API_PORT:-8080}:8080
    command: ["dotnet", "PPMTool.API.dll"]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 5s
      timeout: 5s
      start_period: 1s
      retries: 5

volumes:
  state:

secrets:
  github_token:
    environment: GITHUB_TOKEN
